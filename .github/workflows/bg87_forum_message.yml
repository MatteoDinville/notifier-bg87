name: BG87 Forum message notifier

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  check-forum:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check forum messages
        run: node index.js forum
        env:
          BG87_USER: ${{ secrets.BG87_USER }}
          BG87_PASS: ${{ secrets.BG87_PASS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
