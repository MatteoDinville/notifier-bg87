name: BG87 Notifier

on:
  schedule:
    - cron: "0 * * * *" # toutes les heures
  workflow_dispatch: # bouton manuel dans GitHub

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run script
        run: node index.js
        env:
          BG87_USER: ${{ secrets.BG87_USER }}
          BG87_PASS: ${{ secrets.BG87_PASS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
